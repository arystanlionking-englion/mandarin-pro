<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mandarin Pro · Экзамены</title><style>
:root{--ink:#193b36;--muted:#70817d;--green:#216c58;--bg:#f4f6f2;--line:#e0e7df}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);border-radius:12px;padding:11px 17px;min-height:44px}button:hover{border-color:var(--green)}button.primary{background:var(--green);color:white;border-color:var(--green)}button.danger{color:#b34438}button:disabled{opacity:.45;cursor:default}input,select,textarea{width:100%;border:1px solid #cdd9d0;border-radius:10px;background:white;padding:11px;color:var(--ink)}textarea{min-height:95px;resize:vertical}input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--green)}label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}label input,label textarea,label select{display:block;margin-top:6px}h1,h2,h3,p{margin-top:0}h1{font-size:36px;letter-spacing:-1.5px;line-height:1.2}h2{font-size:23px;letter-spacing:-.6px}h3{font-size:18px}small,.muted{color:var(--muted)}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100dvh}aside{padding:28px 20px;border-right:1px solid var(--line);background:#fff;display:flex;flex-direction:column;gap:28px}aside nav{display:grid;gap:8px}nav button{text-align:left;border-color:transparent;background:transparent}nav button.active{background:#eaf2eb;color:var(--green);font-weight:700}.brand{font-size:20px;font-weight:800;letter-spacing:-.7px}.brand b{background:var(--green);color:white;display:inline-grid;place-items:center;width:37px;height:37px;border-radius:12px;margin-right:8px}.brand small{display:block;margin-left:49px;font-size:10px;letter-spacing:2px}.sidebottom{margin-top:auto;font-size:12px;color:var(--muted)}main{padding:28px 42px 60px;max-width:1500px;width:100%;margin:auto}.topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-botto -bottom:1px solid var(--line);padding:12px;white-space:nowrap}.chartrow{display:grid;grid-template-columns:130px 1fr 50px;gap:12px;align-items:center;margin:15px 0}.chartrow .progress{height:16px}.error{color:#ad342b;background:#fff0ed;padding:12px;border-radius:10px;white-space:pre-wrap}.success{color:var(--green)}dialog{border:0;border-radius:20px;max-width:850px;width:95%;max-height:90dvh;padding:26px;color:var(--ink)}dialog::backdrop{background:#102c275e;backdrop-filter:blur(3px)}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#193b36;color:white;padding:12px 20px;border-radius:12px;z-index:999;display:none;max-width:90%}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 system-ui}audio{max-width:100%}.sticky{position:sticky;top:0;z-index:2;background:var(--bg);padding:12px 0}.split{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:24px}.detail{white-space:pre-wrap;overflow-wrap:anywhere}.accent{color:#bb7d36}.mobileonly{display:none}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:24px}.layout{grid-template-columns:190px minmax(0,1fr)}aside{padding:24px 12px}.split{grid-template-columns:1fr}}@media(max-width:700px){.layout{display:block}aside{padding:14px 18px;gap:12px;border-bottom:1px solid var(--line)}aside nav{display:flex;overflow:auto}aside nav button{white-space:nowrap;font-size:13px;padding:8px 12px}.sidebottom{display:none}.brand small{display:none}main{padding:20px 16px max(30px,env(safe-area-inset-bottom))}.topbar{margin-bottom:22px;align-items:flex-start;flex-wrap:wrap}.grid,.two{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}h1{font-size:29px}.hero{padding:23px}.panel,.card{padding:20px}.topbar select{max-width:170px}.chartrow{grid-template-columns:90px 1fr 45px}.row>*{max-width:100%}dialog{padding:18px}}
</style><body><div id="app"></div><dialog id="modal"></dialog><div id="toast" role="status"></div><input id="file" type="file" hidden><script>
'use strict';
const KEY='mandarin.exams.v1',TYPES={single:'Один ответ',multiple:'Несколько ответов',text:'Короткий ответ',hanzi:'Иероглифы',translation:'Перевод',audio:'Аудирование',reading:'Чтение',essay:'Эссе',matching:'Сопоставление',gaps:'Пропуски',boolean:'Верно / неверно',order:'Порядок слов'},STATES=['Черновик','Опубликован','Открыт','Закрыт','Архив'];
let db={version:1,exams:[],attempts:[],students:[],ledger:[],audit:[]},role='admin',student='',page='exams',draft=null,active=null,qi=0,filter='',resultFilter='',storageOK=true;
try{let saved=localStorage.getItem(KEY);if(saved)db=JSON.parse(saved)}catch(e){storageOK=false}
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID?crypto.randomUUID():'id'+Date.now()+Math.random().toString(36).slice(2),clone=x=>JSON.parse(JSON.stringify(x)),sum=a=>a.reduce((s,x)=>s+x,0),max=e=>sum(e.questions.map(q=>+q.points)),now=()=>Date.now(),date=x=>x?new Date(x).toLocaleString('ru-RU'):'—',lines=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean),choices=q=>q.type==='boolean'?['Верно','Неверно']:lines(q.options),me=()=>db.students.find(s=>s.id===student),balance=id=>sum(db.ledger.filter(t=>t.student===id).map(t=>t.amount));
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3500)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));storageOK=true;return true}catch(e){storageOK=false;toast('Не удалось сохранить на устройстве. Экспортируйте резервную копию.');return false}}
function commit(fn){let old=clone(db);fn();if(!save()){db=old;return false}return true}
function tx(id,s,amount,reason){if(!db.ledger.some(t=>t.id===id))db.ledger.push({id,student:s,amount,reason,time:now()})}
function audit(action,info){db.audit.push({time:now(),actor:'Локальный преподаватель',action,info})}
function btn(text,code,cls=''){return `<button class="${cls}" onclick="${code}">${text}</button>`}
function field(id,label,value='',type='text',extra=''){return `<label>${label}<input id="${id}" type="${type}" value="${esc(value)}" ${extra}></label>`}
function area(id,label,value=''){return `<label>${label}<textarea id="${id}">${esc(value)}</textarea></label>`}
function sel(id,label,options,value){return `<label>${label}<select id="${id}">${options.map(o=>`<option value="${esc(o[0])}" ${o[0]==value?'selected':''}>${esc(o[1])}</option>`).join('')}</select></label>`}
function modal(html){$('modal').innerHTML=`<div class="row between" style="margin-bottom:18px"><span class="tag">MANDARIN PRO</span>${btn('Закрыть',"$('modal').close()")}</div>${html}`;$('modal').showModal()}
function go(p){if(draft&&!confirm('Выйти из редактора? Несохранённые изменения будут потеряны.'))return;draft=null;page=p;filter='';render()}
function shell(body){let nav=role==='admin'?[['exams','▦  Экзамены'],['results','✓  Результаты'],['stats','↗  Статистика'],['students','◉  Ученики'],['settings','⚙  Данные и помощь']]:[['exams','▦  Доступные'],['progress','◷  В процессе'],['results','✓  Результаты'],['history','↗  История'],['settings','⚙  Помощь']];$('app').innerHTML=`<div class="layout"><aside><div class="brand"><b>文</b>Mandarin<span style="font-weight:400"> Pro</span><small>LEARNING SPACE</small></div><nav>${nav.map(([p,t])=>btn(t,`go('${p}')`,page===p?'active':'')).join('')}</nav><div class="sidebottom">ЭКЗАМЕНЫ И ТЕСТЫ<br>Локальная версия · 1.0<br><br>Данные на этом устройстве.<br>Без подключения к серверу.</div></aside><main><header class="topbar"><span class="muted">Учебное пространство / <b style="color:var(--ink)">Экзамены</b></span><div class="row"><select aria-label="Режим" onchange="switchRole(this.value)"><option value="admin" ${role==='admin'?'selected':''}>Преподаватель</option><option value="student" ${role==='student'?'selected':''}>Ученик</option></select>${role==='student'?`<select aria-label="Ученик" onchange="student=this.value;render()"><option value="">Выбрать ученика</option>${db.students.map(s=>`<option value="${s.id}" ${s.id===student?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`:''}</div></header>${!storageOK?'<div class="error">Сохранение недоступно. Сделайте резервную копию в разделе «Данные и помощь».</div>':''}${body}</main></div>`}
function switchRole(v){if(draft&&!confirm('Выйти без сохранения?'))return render();role=v;draft=null;page='exams';render()}
function available(e){return e.state==='Открыт'&&(!e.open||now()>=new Date(e.open).getTime())&&(!e.close||now()<new Date(e.close).getTime())&&(!e.access.length||e.access.includes(student))}
function render(){if(active){runView();return}if(draft){editor();return}if(page==='exams'||page==='progress')catalog();else if(page==='results'||page==='history')results();else if(page==='students')students();else if(page==='stats')stats();else settings()}
function catalog(){let exams=role==='admin'?db.exams:db.exams.filter(e=>available(e)||e.state==='Опубликован'&&(!e.access.length||e.access.includes(student)));let inProgress=db.attempts.filter(a=>a.student===student&&!a.end);if(page==='progress')exams=inProgress.map(a=>a.exam);let finished=db.attempts.filter(a=>a.end);shell(`<div class="hero"><span class="tag">Проверяйте знания. Замечайте прогресс.</span><h1>${role==='admin'?'От первого вопроса<br>до нового достижения.':'Твой следующий шаг<br>в изучении языка.'}</h1><p>${role==='admin'?'Создавайте экзамены, проверяйте ответы и следите за результатами учеников в одном месте.':'Выбери экзамен, прочитай инструкцию и покажи, чему ты научился.'}</p></div><div class="metrics"><div><span class="muted">${role==='admin'?'Экзаменов':'Доступно'}</span><div class="stat">${exams.length}</div></div><div><span class="muted">${role==='admin'?'Завершённых попыток':'Мой баланс'}</span><div class="stat">${role==='admin'?finished.length:balance(student)}</div></div><div><span class="muted">На проверке</span><div class="stat">${finished.filter(a=>a.status==='Ожидает проверки'&&(role==='admin'||a.student===student)).length}</div></div><div><span class="muted">${role==='admin'?'Учеников':'В процессе'}</span><div class="stat">${role==='admin'?db.students.length:inProgress.length}</div></div></div><div class="row between" style="margin-bottom:20px"><h2 style="margin:0">${page==='progress'?'В процессе':'Экзамены и тесты'} <span class="muted">${exams.length}</span></h2>${role==='admin'?btn('+ Создать экзамен','editExam()', 'primary'):''}</div><input aria-label="Поиск экзамена" placeholder="Поиск по названию или уровню…" value="${esc(filter)}" oninput="filter=this.value;drawCards()" style="margin-bottom:20px"><div id="cards" class="grid"></div>`);window.currentExams=exams;drawCards()}
function drawCards(){let es=window.currentExams.filter(e=>(e.title+' '+e.level).toLowerCase().includes(filter.toLowerCase()));$('cards').innerHTML=es.length?es.map(e=>{let a=db.attempts.find(a=>a.exam.id===e.id&&a.student===student&&!a.end);return `<article class="card"><div class="row between"><span class="pill">${esc(e.level)}</span><span class="muted" style="font-size:12px">${esc(e.state)}</span></div><h3 style="margin:24px 0 8px">${esc(e.title)}</h3><p class="muted">${esc(e.description||'Проверьте свои знания и закрепите материал.')}</p><div class="row muted"><span>${e.questions.length} заданий</span> · <span>${e.minutes} мин</span> · <span>${max(e)} баллов</span></div><div style="font-size:12px;margin-top:14px">Порог ${e.pass}% · Стоимость ${e.cost} · Награда ${e.reward}</div><div class="foot row">${role==='admin'?btn('Редактировать',`editExam('${e.id}')`,'primary')+btn('Просмотр',`preview('${e.id}')`):a?btn('Продолжить',`resume('${a.id}')`,'primary'):btn('Начать экзамен',`start('${e.id}')`,'primary')}</div></article>`}).join(''):'<div class="panel empty" style="grid-column:1/-1">Здесь пока нет экзаменов.<br>'+ (role==='admin'?'Создайте первый экзамен или добавьте учебный пример в разделе «Данные и помощь».':'Выберите ученика. Преподаватель должен открыть экзамен и предоставить доступ.')+'</div>'}
function freshQuestion(){return {id:uid(),type:'single',text:'',instruction:'',options:'',answer:'',alternatives:'',points:1,required:true,explanation:'',material:'',audio:'',rubric:'',manual:false,ignoreCase:true,ignoreSpaces:true,ignorePunctuation:false,partial:false,min:0,max:0}}
function editExam(id){draft=id?clone(db.exams.find(e=>e.id===id)):{id:uid(),title:'',description:'',instruction:'',subject:'Китайский язык',level:'Начальный',state:'Черновик',open:'',close:'',minutes:20,limit:1,pass:60,cost:0,reward:0,reveal:'after',navigate:true,access:[],questions:[]};editor()}
function editor(){shell(`<div class="row between"><div><span class="tag">КОНСТРУКТОР ЭКЗАМЕНА</span><h1 style="margin-top:8px">${draft.title?'Редактирование':'Новый экзамен'}</h1></div>${btn('Сохранить экзамен','saveExam()','primary')}</div><div class="panel"><div class="two">${field('et','Название',draft.title)}${sel('es','Статус',STATES.map(x=>[x,x]),draft.state)}${field('esub','Предмет',draft.subject)}${field('el','Уровень',draft.level)}</div>${area('ed','Описание',draft.description)}${area('ei','Инструкция ученику',draft.instruction)}<div class="two">${field('eo','Открытие',draft.open,'datetime-local')}${field('ec','Закрытие',draft.close,'datetime-local')}${field('em','Время, минут',draft.minutes,'number','min="1" max="600"')}${field('ea','Попыток на ученика',draft.limit,'number','min="1"')}${field('ep','Проходной процент',draft.pass,'number','min="0" max="100"')}${sel('er','Показ правильных ответов',[['after','После завершения и полной проверки'],['closed','После закрытия экзамена'],['never','Не показывать']],draft.reveal)}${field('ecost','Стоимость, баллы',draft.cost,'number','min="0"')}${field('erew','Награда за сдачу, баллы',draft.reward,'number','min="0"')}</div><label><input id="enav" type="checkbox" ${draft.navigate?'checked':''}> Разрешить возвращаться к предыдущим вопросам</label><h3>Кому доступен экзамен</h3><small>Никто не выбран — доступен всем локальным ученикам.</small><div class="row">${db.students.map(s=>`<label><input type="checkbox" class="access" value="${s.id}" ${draft.access.includes(s.id)?'checked':''}> ${esc(s.name)} · ${esc(s.group)}</label>`).join('')||'<p class="muted">Ученики добавляются в разделе «Ученики».</p>'}</div></div><div class="panel"><div class="row between"><h2>Вопросы · ${draft.questions.length} <small>/ ${max(draft)} баллов</small></h2>${btn('+ Добавить вопрос','questionEditor()','primary')}</div><div class="row">${btn('Скачать шаблон CSV','template()')}${btn('Импортировать CSV','chooseImport()')}${btn('Экспорт вопросов','exportQuestions()')}${btn('Предварительный просмотр','capture();previewDraft()')}</div><p class="muted" style="font-size:12px">Импорт сначала проверяет файл и показывает ошибки. Примеры отделены меткой example.</p><div id="importstatus"></div>${draft.questions.map((q,i)=>`<div class="question"><div class="row between"><span class="pill">${i+1} · ${TYPES[q.type]}</span><span>${q.points} б.</span></div><h3 style="margin-top:14px">${esc(q.text)}</h3><div class="row">${btn('Изменить',`questionEditor(${i})`)}${btn('↑',`moveQ(${i},-1)`)}${btn('↓',`moveQ(${i},1)`)}${btn('Удалить',`removeQ(${i})`,'danger')}</div></div>`).join('')||'<div class="empty">Добавьте вопрос или импортируйте файл.</div>'}</div><div class="row">${btn('Сохранить экзамен','saveExam()','primary')}${btn('Отмена',"go('exams')")}</div>`)}
function capture(){if(!$('et'))return;let map={title:'et',state:'es',description:'ed',instruction:'ei',subject:'esub',level:'el',open:'eo',close:'ec',reveal:'er'};Object.entries(map).forEach(([k,id])=>draft[k]=$(id).value);Object.entries({minutes:'em',limit:'ea',pass:'ep',cost:'ecost',reward:'erew'}).forEach(([k,id])=>draft[k]=Number($(id).value));draft.navigate=$('enav').checked;draft.access=[...document.querySelectorAll('.access:checked')].map(x=>x.value)}
function examErrors(e){let errors=[];if(!e.title.trim())errors.push('Укажите название.');if(!Number.isInteger(e.minutes)||e.minutes<1||e.minutes>600)errors.push('Время: от 1 до 600 минут.');if(!Number.isInteger(e.limit)||e.limit<1)errors.push('Число попыток — целое от 1.');if(!Number.isFinite(e.pass)||e.pass<0||e.pass>100)errors.push('Проходной процент: 0–100.');if([e.cost,e.reward].some(n=>!Number.isFinite(n)||n<0))errors.push('Стоимость и награда должны быть неотрицательными.');if(e.open&&e.close&&e.open>=e.close)errors.push('Закрытие должно быть позже открытия.');if(!e.questions.length)errors.push('Добавьте хотя бы один вопрос.');e.questions.forEach((q,i)=>questionErrors(q).forEach(x=>errors.push(`Вопрос ${i+1}: ${x}`)));return errors}
function saveExam(){capture();let err=examErrors(draft);if(err.length)return modal('<h2>Проверьте экзамен</h2><div class="error">'+esc(err.join('\n'))+'</div>');if(commit(()=>{let i=db.exams.findIndex(e=>e.id===draft.id);if(i<0)db.exams.push(clone(draft));else db.exams[i]=clone(draft);audit('Сохранён экзамен',draft.title)})){draft=null;page='exams';render();toast('Экзамен сохранён на устройстве')}}
function moveQ(i,d){capture();if(i+d<0||i+d>=draft.questions.length)return;[draft.questions[i],draft.questions[i+d]]=[draft.questions[i+d],draft.questions[i]];editor()}
function removeQ(i){capture();if(confirm('Удалить этот вопрос?')){draft.questions.splice(i,1);editor()}}
let editingQ=null,editingIndex=null;
function questionEditor(i){capture();editingIndex=i;editingQ=i===undefined?freshQuestion():clone(draft.questions[i]);drawQEditor()}
function drawQEditor(){let q=editingQ,choice=['single','multiple','boolean'].includes(q.type),opts=['single','multiple','audio','reading','matching','order'].includes(q.type);modal(`<h2>${editingIndex===undefined?'Новый вопрос':'Редактирование вопроса'}</h2>${sel('qt','Тип задания',Object.entries(TYPES),q.type)}${area('qtext','Текст вопроса',q.text)}${field('qinst','Инструкция',q.instruction)}${['reading','gaps'].includes(q.type)?area('qmat',q.type==='gaps'?'Текст с пропусками ___':'Текст для чтения',q.material):''}${opts?area('qopts',q.type==='matching'?'Пары: слово = перевод, каждая с новой строки':q.type==='order'?'Слова/фразы в правильном порядке, каждое с новой строки':'Варианты ответов, каждый с новой строки (или пусто для ввода текста)',q.options):''}${q.type==='audio'?`<label>Аудио до 1 МБ<input type="file" accept="audio/*" onchange="loadAudio(this)"></label><small id="audionote">${q.audio?'Аудиофайл загружен':'Загрузите файл — он будет встроен в экзамен.'}</small>`:''}${!['essay','matching','order'].includes(q.type)?area('qans',q.type==='multiple'?'Правильные варианты: точные тексты, каждый с новой строки':q.type==='gaps'?'Ответы на пропуски по порядку, каждый с новой строки':'Эталон: точный текст правильного ответа',q.answer):''}${['text','hanzi','translation','audio','reading'].includes(q.type)?area('qalt','Допустимые альтернативы, каждая с новой строки',q.alternatives):''}<div class="two">${field('qpoints','Максимальный балл',q.points,'number','min="0.1" step="0.1"')}${field('qid','ID вопроса',q.id)}</div>${['essay','translation'].includes(q.type)?area('qrub','Критерии ручной оценки',q.rubric):''}${q.type==='essay'?`<div class="two">${field('qmin','Минимум символов (0 — нет)',q.min,'number','min="0"')}${field('qmax','Максимум символов (0 — нет)',q.max,'number','min="0"')}</div>`:''}${q.type==='translation'?`<label><input id="qmanual" type="checkbox" ${q.manual?'checked':''}> Ручная проверка перевода</label>`:''}<label><input id="qrequired" type="checkbox function readQ(){let q=editingQ;Object.entries({text:'qtext',instruction:'qinst',options:'qopts',answer:'qans',alternatives:'qalt',material:'qmat',rubric:'qrub',explanation:'qexp',id:'qid'}).forEach(([k,id])=>{if($(id))q[k]=$(id).value});for(let [k,id]of Object.entries({points:'qpoints',min:'qmin',max:'qmax'}))if($(id))q[k]=+$(id).value;for(let [k,id]of Object.entries({required:'qrequired',manual:'qmanual',partial:'qpartial',ignoreCase:'qcase',ignoreSpaces:'qspace',ignorePunctuation:'qpunct'}))if($(id))q[k]=$(id).checked}
function loadAudio(input){let f=input.files[0];if(!f)return;if(f.size>1000000)return toast('Максимум 1 МБ для локального хранения.');let r=new FileReader();r.onload=()=>{editingQ.audio=r.result;$('audionote').textContent='Загружено: '+f.name};r.readAsDataURL(f)}
function questionErrors(q){let e=[];if(!q.id)e.push('Нет ID.');if(!TYPES[q.type])e.push('Неизвестный тип.');if(!q.text.trim())e.push('Нет текста вопроса.');if(!Number.isFinite(q.points)||q.points<=0)e.push('Баллы должны быть больше нуля.');let o=choices(q);if(['single','multiple'].includes(q.type)&&o.length<2)e.push('Нужно не меньше двух вариантов.');if(new Set(o).size!==o.length)e.push('Варианты не должны повторяться.');if(!['essay','matching','order'].includes(q.type)&&!q.manual&&!q.answer.trim())e.push('Нет правильного ответа.');if(['single','multiple','boolean'].includes(q.type)||['reading','audio'].includes(q.type)&&o.length){let ans=q.type==='multiple'?lines(q.answer):[q.answer.trim()];if(ans.some(a=>!o.includes(a)))e.push('Правильный ответ должен совпадать с текстом варианта.');}if(q.type==='matching'&&(o.length<2||o.some(x=>x.split('=').length!==2||x.split('=').some(y=>!y.trim()))))e.push('Укажите не менее двух пар: слово = перевод.');if(q.type==='order'&&o.length<2)e.push('Добавьте не менее двух элементов.');if(q.type==='audio'&&!q.audio)e.push('Загрузите аудио.');if(q.type==='reading'&&!q.material.trim())e.push('Добавьте текст для чтения.');if(q.type==='gaps'&&((q.material.match(/___/g)||[]).length!==lines(q.answer).length||!lines(q.answer).length))e.push('Число пропусков ___ должно совпадать с числом ответов.');if(q.type==='essay'&&(q.min<0||q.max<0||q.max&&q.min>q.max))e.push('Проверьте ограничения объёма.');return e}
function saveQuestion(){readQ();let e=questionErrors(editingQ);if(draft.questions.some((q,i)=>q.id===editingQ.id&&i!==editingIndex))e.push('ID вопроса уже существует.');if(e.length){$('qerror').innerHTML='<div class="error">'+esc(e.join('\n'))+'</div>';return}if(editingIndex===undefined)draft.questions.push(clone(editingQ));else draft.questions[editingIndex]=clone(editingQ);$('modal').close();editor()}
function preview(id){previewExam(db.exams.find(e=>e.id===id))}function previewDraft(){previewExam(draft)}function previewExam(e){modal(`<h2>${esc(e.title||'Предпросмотр')}</h2><p class="detail">${esc(e.instruction)}</p>${e.questions.map((q,i)=>`<div class="question"><span class="pill">${i+1} · ${TYPES[q.type]} · ${q.points} б.</span><h3>${esc(q.text)}</h3>${answerUI(q,null,i,true)}</div>`).join('')}`)}

function adjust(id){let n=+$('amount').value,r=$('reason').value.trim();if(!Number.isFinite(n)||!n||!r)return toast('Укажите сумму и причину.');if(balance(id)+n<0)return toast('Недостаточно баллов');if(commit(()=>{tx(uid(),id,n,r);audit('Изменение баланса',id+': '+n+' '+r)})){studentLedgerRefresh(id)}}function studentLedgerRefresh(id){$('modal').close();students();studentLedger(id)}
function start(id){let e=db.exams.find(e=>e.id===id);if(!student||!me())return toast('Сначала выберите ученика.');if(!available(e))return toast('Экзамен ещё не открыт или уже закрыт.');if(db.attempts.filter(a=>a.student===student&&a.exam.id===id).length>=e.limit)return toast('Доступные попытки использованы.');if(balance(student)<e.cost)return toast('Недостаточно баллов. Обратитесь к преподавателю.');modal(`<span class="tag">ПЕРЕД НАЧАЛОМ</span><h2>${esc(e.title)}</h2><p class="detail">${esc(e.instruction||'Прочитайте задания и ответьте на вопросы.')}</p><div class="note">${e.minutes} минут · ${e.questions.length} вопросов · порог ${e.pass}%<br>Стоимость ${e.cost} баллов · награда за сдачу ${e.reward} баллов.<br>Таймер продолжает идти после закрытия страницы. ${e.navigate?'Можно возвращаться к вопросам.':'Возвращение к предыдущим вопросам запрещено.'}</div>${btn('Подтверждаю, начать',`confirmStart('${id}')`,'primary')}`)}
function confirmStart(id){let e=db.exams.find(e=>e.id===id);let existing=db.attempts.find(a=>a.student===student&&a.exam.id===id&&!a.end);if(existing){$('modal').close();return resume(existing.id)}if(!me()||!available(e)||balance(student)<e.cost||db.attempts.filter(a=>a.student===student&&a.exam.id===id).length>=e.limit){$('modal').close();return toast('Условия изменились. Начните заново.')}let a={id:uid(),student,studentName:me().name,group:me().group,exam:clone(e),start:now(),deadline:Math.min(now()+e.minutes*60000,e.close?new Date(e.close).getTime():Infinity),answers:{},grades:{},position:0,end:null,status:'В процессе',number:db.attempts.filter(x=>x.student===student&&x.exam.id===id).length+1};if(commit(()=>{db.attempts.push(a);tx(a.id+':cost',student,-e.cost,'Начало: '+e.title)})){$('modal').close();active=a.id;qi=0;runView()}}
function resume(id){let a=db.attempts.find(a=>a.id===id);if(!a||a.student!==student)return;active=id;qi=a.position||0;tick();render()}
const attempt=()=>db.attempts.find(a=>a.id===active),hasAnswer=v=>Array.isArray(v)?v.some(x=>String(x??'').trim()):String(v??'').trim().length>0;
function answerUI(q,a,i,preview=false){let v=a?.answers[q.id],disabled=preview?'disabled':'',change=preview?'':`onchange="answer(${i},this.value)"`,textInput=(value,index)=>`<input ${disabled} aria-label="Ответ ${index+1}" value="${esc(value||'')}" oninput="answerPart(${i},${index},this.value)">`;let head=`<p class="muted">${esc(q.instruction)}</p>`;if(q.type==='reading'||q.type==='gaps')head+=`<div class="note detail" style="font-size:17px">${esc(q.material)}</div>`;if(q.type==='audio'&&/^data:audio\//.test(q.audio))head+=`<audio controls preload="metadata" src="${esc(q.audio)}"></audio>`;let opts=choices(q);if(['single','multiple','boolean'].includes(q.type)||['reading','audio'].includes(q.type)&&opts.length)return head+opts.map((x,j)=>`<label class="option"><input ${disabled} type="${q.type==='multiple'?'checkbox':'radio'}" name="ans${i}" value="${esc(x)}" ${(q.type==='multiple'?(v||[]).includes(x):v===x)?'checked':''} onchange="${q.type==='multiple'?`answerMulti(${i},this.value,this.checked)`:`answer(${i},this.value)`}"><span>${esc(x)}</span></label>`).join('');if(q.type==='matching'){let pairs=opts.map(x=>x.split('=').map(s=>s.trim())),right=pairs.map(p=>p[1]).sort((a,b)=>a.localeCompare(b));return head+pairs.map((p,j)=>`<label>${esc(p[0])}<select ${disabled} onchange="answerPart(${i},${j},this.value)"><option value="">Выберите пару</option>${right.map(x=>`<option ${v?.[j]===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`).join('')}if(q.type==='order'){let sorted=[...opts].sort((a,b)=>a.localeCompare(b));return head+'<p class="muted">Выберите элементы по порядку.</p>'+opts.map((_,j)=>`<label>Позиция ${j+1}<select ${disabled} onchange="answerPart(${i},${j},this.value)"><option value="">Выберите</option>${sorted.map(x=>`<option ${v?.[j]===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`).join('')}if(q.type==='gaps')return head+lines(q.answer).map((_,j)=>`<label>Пропуск ${j+1}${textInput(v?.[j],j)}</label>`).join('');if(q.type=== function runView(){let a=attempt();if(!a||a.end){active=null;return render()}qi=Math.min(qi,a.exam.questions.length-1);let q=a.exam.questions[qi],answered=a.exam.questions.filter(q=>hasAnswer(a.answers[q.id])).length;shell(`<div class="sticky row between"><div><span class="tag">ЭКЗАМЕН В ПРОЦЕССЕ</span><h2 style="margin:3px 0">${esc(a.exam.title)}</h2></div><div><span class="muted">Осталось</span><div class="timer" id="timer"></div></div></div><div class="split"><div class="panel"><div class="row between"><span class="pill">Вопрос ${qi+1} из ${a.exam.questions.length}</span><small>${q.points} баллов · ${TYPES[q.type]} ${q.required?'· обязательный':''}</small></div><h2 class="detail" style="margin-top:24px">${esc(q.text)}</h2>${answerUI(q,a,qi)}<div class="row between" style="margin-top:26px">${qi&&a.exam.navigate?btn('← Назад',`nextQ(${qi-1})`):'<span></span>'}${qi<a.exam.questions.length-1?btn('Далее →',`nextQ(${qi+1})`,'primary'):btn('Завершить экзамен','submitAttempt()','primary')}</div><small id="saved" class="success">Ответы сохраняются на этом устройстве</small></div><div><div class="panel"><h3>Твой прогресс</h3><p id="progressText">${answered} из ${a.exam.questions.length} отвечено</p><div class="progress"><i id="progressBar" style="width:${answered/a.exam.questions.length*100}%"></i></div><div class="row qnav" style="margin:20px 0">${a.exam.questions.map((q,i)=>`<button ${!a.exam.navigate&&i!==qi?'disabled':''} class="${i===qi?'current ':''}${hasAnswer(a.answers[q.id])?'done':''}" onclick="nextQ(${i})">${i+1}</button>`).join('')}</div>${btn('Завершить','submitAttempt()')}${btn('Выйти и продолжить позже','leaveAttempt()')}</div><small>Таймер не останавливается при выходе. Данные доступны только в этом браузере.</small></div></div>`);tick()}
function answer(i,v){let a=attempt();if(!a||a.end)return;if(now()>=a.deadline){finish(a,true);return}if(commit(()=>{a.answers[a.exam.questions[i].id]=v})){let c=a.exam.questions.filter(q=>hasAnswer(a.answers[q.id])).length;if($('saved'))$('saved').textContent='✓ Сохранено на устройстве · '+new Date().toLocaleTimeString('ru-RU');if($('progressText'))$('progressText').textContent=c+' из '+a.exam.questions.length+' отвечено';if($('progressBar'))$('progressBar').style.width=c/a.exam.questions.length*100+'%';document.querySelectorAll('.qnav button').forEach((b,j)=>b.classList.toggle('done',hasAnswer(a.answers[a.exam.questions[j].id])))}else if($('saved'))$('saved').textContent='Ошибка сохранения — ответ не сохранён'}
function answerMulti(i,v,checked){let a=attempt(),old=a.answers[a.exam.questions[i].id]||[];answer(i,checked?[...new Set([...old,v])]:old.filter(x=>x!==v))}
function answerPart(i,j,v){let a=attempt(),arr=[...(a.answers[a.exam.questions[i].id]||[])];arr[j]=v;answer(i,arr)}
function nextQ(i){let a=attempt();if(!a.exam.navigate&&i<qi)return;qi=i;commit(()=>a.position=i);runView()}
function leaveAttempt(){active=null;page='progress';render()}
function norm(s,q){s=String(s??'').normalize('NFC');if(q.ignoreCase)s=s.toLocaleLowerCase();if(q.ignoreSpaces)s=s.trim().replace(/\s+/g,' ');if(q.ignorePunctuation)s=s.replace(/[\p{P}]/gu,'');return s}
function grade(q,v){if(!hasAnswer(v))return {score:0,status:'Пропущено'};if(q.type==='essay'||q.type==='translation'&&q.manual)return {score:null,status:'Ожидает проверки'};let ratio=0;if(q.type==='multiple'){let a=lines(q.answer),vals=[...new Set(v||[])],good=vals.filter(x=>a.includes(x)).length,bad=vals.length-good;ratio=q.partial?Math.max(0,good/a.length-bad/Math.max(1,choices(q).length-a.length)):good===a.length&&!bad?1:0}else if(['matching','gaps','order'].includes(q.type)){let target=q.type==='matching'?lines(q.options).map(x=>x.split('=')[1].trim()):q.type==='order'?lines(q.options):lines(q.answer);ratio=target.filter((x,i)=>norm(x,q)===norm(v?.[i],q)).length/target.length}else{let targets=[q.answer,...lines(q.alternatives)];ratio=targets.some(x=>norm(x,q)===norm(v,q))?1:0}return {score:Math.round(q.points*ratio*100)/100,status:ratio===1?'Правильно':ratio===0?'Неправильно':'Частично'}}
function recalc(a){a.score=sum(Object.values(a.grades).map(g=>g.score||0));a.percent=Math.round(a.score/max(a.exam)*1000)/10;a.pending=Object.values(a.grades).filter(g=>g.score===null).length;a.status=a.pending?'Ожидает проверки':a.percent>=a.exam.pass?'Сдан':'Не сдан';if(!a.pending){let target=a.status==='Сдан'?a.exam.reward:0,paid=sum(db.ledger.filter(t=>t.attempt===a.id&&t.kind==='reward').map(t=>t.amount));if(target!==paid){db.ledger.push({id:uid(),student:a.student,amount:target-paid,reason:'Итог / корректировка: '+a.exam.title,time:now(),attempt:a.id,kind:'reward'})}}}
function submitAttempt(){let a=attempt();let missing=a.exam.questions.filter(q=>q.required&&!hasAnswer(a.answers[q.id]));let lengthErrors=a.exam.questions.filter(q=>q.type==='essay'&&hasAnswer(a.answers[q.id])&&((q.min&&Array.from(a.answers[q.id]).length<q.min)||(q.max&&Array.from(a.answers[q.id]).length>q.max)));if(missing.length||lengthErrors.length)return modal(`<h2>Проверьте ответы</h2><p>Не заполнено обязательных вопросов: ${missing.length}. Нарушений объёма эссе: ${lengthErrors.length}.</p><p>Вернитесь к заданиям или завершите попытку с текущими ответами.</p>${btn('Завершить с текущими ответами',"$('modal').close();finish(attempt())",'primary')}`);if(confirm('Завершить экзамен? Изменить ответы после отправки нельзя.'))finish(a)}
function finish(a,timeout=false){if(!a||a.end)return;let id=a.id;if(commit(()=>{a.end=timeout?a.deadline:now();a.exam.questions.forEach(q=>a.grades[q.id]=grade(q,a.answers[q.id]));recalc(a);audit('Завершена попытка',a.id)})){if(active===id){active=null;page='results';render();showResult(id);if(timeout)toast('Время истекло. Сохранённые ответы проверены.')}}}
let warned=new Set();function tick(){let unfinished=db.attempts.filter(a=>!a.end);unfinished.forEach(a=>{if(now()>=a.deadline)finish(a,true)});let a=attempt();if(!a)return;let sec=Math.max(0,Math.ceil((a.deadline-now())/1000));if($('timer')){$('timer').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');$('timer').style.color=sec<60?'#b34438':''}if(sec<=60&&!warned.has(a.id)){warned.add(a.id);toast('Осталась одна минута')}}

function manualGrade(id,i){let a=db.attempts.find(a=>a.id===id),q=a.exam.questions[i],raw=$('gr'+i).value,n=+raw,c=$('gc'+i).value.trim();if(raw===''||!Number.isFinite(n)||n<0||n>q.points)return toast('Оценка от 0 до '+q.points);if(!c)return toast('Добавьте комментарий к оценке.');let old=a.grades[q.id].score;if(commit(()=>{a.grades[q.id]={score:n,status:n===q.points?'Правильно':n===0?'Неправильно':'Частично',comment:c};recalc(a);audit('Ручная оценка',id+' / '+q.id+': '+old+' → '+n+'; '+c)})){$('modal').close();results();showResult(id)}}

const HELP=`MANDARIN PRO — ЭКЗАМЕНЫ И ТЕСТЫ

Быстрый запуск
1. Откройте HTML в современном браузере. Установка и интернет не нужны.
2. Преподаватель → Ученики → Добавить ученика.
3. Экзамены → Создать экзамен → Добавить вопросы → статус «Открыт» → Сохранить.
4. Переключите режим на «Ученик», выберите профиль и начните экзамен.
5. Результаты → Подробнее: ручная оценка эссе / перевода.

Локальная версия
Все данные находятся в localStorage текущего браузера. Регулярно экспортируйте JSON-копию. Режимы преподавателя и ученика — рабочее переключение, а НЕ защита доступа. Правильные ответы хранятся в локальных данных и доступны владельцу устройства. Баллы внутренние. Между устройствами данные автоматически не передаются. Не используйте эту версию для защищённой аттестации без интеграции сервера.
При очистке данных браузера история исчезает. На iPhone откройте HTML в браузере/HTML-приложении; системный предпросмотр файла может не запускать JavaScript. После размещения файла внутри вашей программы используйте адрес приложения в Safari.

Импорт CSV
Скачайте шаблон из редактора. Кодировка UTF-8; разделитель ; (также читается запятая). Строки внутри ячеек заключены в кавычки. Каждый вопрос имеет уникальный ID. Колонки не переименовывать. Примеры имеют example=true и пропускаются. Для своих заданий установите example=false. Все логические поля: true или false. points — положительное число, десятичная точка.
Типы: single, multiple, text, hanzi, translation, audio, reading, essay, matching, gaps, boolean, order.
question — вопрос; instruction — инструкция; options — варианты, каждый с новой строки; answer — ТОЧНЫЙ текст ответа, не буква A/B; для multiple правильные варианты с новой строки. alternatives — допустимые ответы с новой строки.
matching: options содержит «老师 = учитель», каждая пара с новой строки. order: options содержит элементы в правильной последовательности. gaps: material содержит ___ для каждого пропуска, answer — ответы по порядку с новой строки. boolean: answer равно «Верно» или «Неверно».
reading: material содержит текст, options можно оставить пустым для текстового ответа. Для нескольких вопросов по одному тексту повторите material в соответствующих строках.
audio: аудио хранится в audio в виде data:audio/...; удобнее сначала создать аудиовопрос и загрузить файл в редакторе, а затем экспортировать. Ограничение 1 МБ на файл.
essay: rubric — критерии; min/max — число символов, 0 означает отсутствие ограничения. translation с manual=true проверяется вручную. required — обязательность. explanation — пояснение после проверки.
ignoreCase игнорирует регистр. ignoreSpaces убирает пробелы по краям и схлопывает повторные; не удаляет значимые пробелы внутри слов. ignorePunctuation убирает пунктуацию. Иероглифы не заменяются похожими и не переводятся между упрощённой и традиционной формой.
partial для multiple: доля выбранных правильных минус доля выбранных неправильных, минимум 0. Без partial нужен точный набор. В сопоставлении, пропусках и порядке баллы пропорциональны числу верных позиций. Пропуск получает 0. Эссе и ручной перевод ожидают проверки, если заполнены.
XLSX в этой автономной версии не поддерживается. CSV открывается в Excel; текстовые поля, начинающиеся с =, Excel может интерпретировать как формулы — импортируйте колонки как текст.

Попытки и баллы
Начатая попытка хранит снимок экзамена: последующие правки не меняют её вопросы и критерии. Таймер основан на конечном времени. При открытой странице завершение происходит по таймеру, при закрытой — при следующем открытии. При начале сохраняются попытка и списание одной записью состояния. При ошибке записи списание отменяется. Награда возникает после полной проверки; пересмотр результата приводит к корректировке награды. Корректировка может сделать баланс отрицательным, если ранее выданная награда уже потрачена. Реальные деньги не используются.
Открыт — доступен по датам; Опубликован — виден, но не запускается; Закрыт/Архив — новые попытки недоступны. Закрытие вручную не прерывает начатые попытки. Возврат преподаватель проводит в «Ученики → Баланс и операции» с причиной. Автоматических возвратов и бонусных уровней нет. Количество вопросов и максимум баллов вычисляются из списка. Проходной порог задан в процентах.

ИНТЕГРАЦИЯ ДЛЯ РАЗРАБОТЧИКА
Файл не использует сторонних библиотек, CDN или сетевых запросов. CSS, HTML и JS находятся в одном файле. Интерфейс и доменные функции можно перенести в существующее приложение.
Ключ хранилища: mandarin.exams.v1. JSON содержит exams, attempts, students, ledger, audit; schema version=1. IDs — UUID. Точка локальной записи — save()/commit(); их необходимо заменить серверными командами, а не просто синхронизировать весь JSON.
1. Удалить локальный переключатель ролей; получать роль и student ID из текущей авторизации Mandarin Pro.
2. Серверные операции: список доступных экзаменов; CRUD экзамена; импорт/валидация; startAttempt с ключом идемпотентности; saveAnswers с ревизией; submitAttempt; gradeAnswer; results; statistics. Проверять принадлежность каждой попытки на сервере.
3. Вынести grade(), recalc(), confirmStart(), finish(), tx() на сервер. Не отдавать answer, alternatives, rubric с эталонами до разрешённого момента. Создавать отдельный DTO вопроса для ученика.
4. Начало попытки + списание, финализация + начисление проводить транзакциями в существующей базе. Уникальные ключи для cost/reward/refund на attempt ID, оптимистические ревизии для изменения оценки. Снимок вопросов хранить на сервере.
5. Таймер и дедлайн — по времени сервера. Плановая задача закрывает истёкшие попытки без открытого клиента. Автосохранение показывать подтверждённым только после ответа сервера; очередь повторной отправки должна учитывать версию и дедлайн.
6. Аудио перенести в существующее файловое хранилище; проверять тип, размер и права на доступ. Группы связать с существующими ID, не с названиями.
7. Защитить API, импорт и экспорт; журнал должен хранить реальный ID преподавателя. Реальный баланс использовать из Mandarin Pro. Локальные профили сопоставить существующим ID. Не загружать этот JSON как доверенные оценки.
8. Для iPhone разместить HTML/компоненты на существующем HTTPS-домене программы. Проверить восстановление, параллельные запросы и права доступа до запуска ученикам.

Ограничения: нет серверной аутентификации, сетевой синхронизации, XLSX, отдельного банка случайной выборки, автоматических возвратов и многоуровневых бонусов. Статистика строится по попыткам, а не уникальным ученикам; при правке существующего вопроса с тем же ID статистика объединит его версии. Для существенно изменённого вопроса используйте новый ID. Одновременная работа в нескольких вкладках с записью не поддерживается.
