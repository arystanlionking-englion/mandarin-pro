(()=>{'use strict';const KEY='mandarin-pro-journal-v3';const TODAY=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const demo={groups:[],students:[{id:'s1',name:'Юнусова Жанель',groupId:null},{id:'s2',name:'Давранов Акмаль',groupId:null},{id:'s3',name:'Коргиёва Лилия',groupId:null},{id:'s4',name:'Арыстанбек Мольдыр',groupId:null},{id:'s5',name:'Бакирова Раимина',groupId:null},{id:'s6',name:'Мусахунова Даяна',groupId:null}],records:[],settings:{reward:300}};function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.groups)&&Array.isArray(d.students)&&Array.isArray(d.records))return {...demo,...d,settings:{...demo.settings,...d.settings}}}catch{}return structuredClone(demo)}let db=load(),role='',studentId='',groupId='',date=TODAY(),selectedDate=TODAY(),draft={},message='',modal='';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch{alert('Не удалось сохранить данные. Проверьте доступность памяти браузера.');return false}};const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);const grade=p=>{for(const [min,letter,gpa,traditional,color] of [[95,'A',4,'Отлично','green'],[90,'A−',3.67,'Отлично','green'],[85,'B+',3.33,'Хорошо','green'],[80,'B',3,'Хорошо','green'],[75,'B−',2.67,'Хорошо','green'],[70,'C+',2.33,'Хорошо','green'],[65,'C',2,'Удовлетворительно','yellow'],[60,'C−',1.67,'Удовлетворительно','yellow'],[55,'D+',1.33,'Удовлетворительно','yellow'],[50,'D',1,'Удовлетворительно','yellow'],[25,'FX',.5,'Неудовлетворительно','red'],[0,'F',0,'Неудовлетворительно','red']])if(p>=min)return{letter,gpa,traditional,color};};const valid=v=>v!==''&&v!==null&&Number.isInteger(Number(v))&&Number(v)>=0&&Number(v)<=100;const points=p=>Math.round(db.settings.reward*p/100);const fmt=n=>Number(n).toFixed(2).replace('.',',');const short=d=>new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'});const records=id=>db.records.filter(r=>r.studentId===id).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt));function render(){const app=$('app');if(!role){app.innerHTML=`<div class="shell login"><div class="brand">MANDARIN <span>PRO</span></div><p class="muted">Электронный журнал · автономный прототип</p><div class="panel"><h2>Добро пожаловать</h2><p class="muted">Выберите режим для тестирования</p><div class="stack"><button class="btn primary" id="adminLogin">Панель администратора →</button><div class="label">Дневник ученика</div><select id="loginStudent">${db.students.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select><button class="btn" id="studentLogin">Открыть мой дневник</button></div><p class="helper">Демо-режим без авторизации. Для реальной системы потребуются сервер и проверка прав доступа.</p></div></div>`;$('adminLogin').onclick=()=>{role='admin';render()};$('studentLogin').onclick=()=>{role='student';studentId=$('loginStudent').value;selectedDate=TODAY();render()};return}app.innerHTML=`<div class="shell"><header class="top"><div><div class="brand">MANDARIN <span>PRO</span> <span class="badge">ЖУРНАЛ</span></div><div class="sub">${role==='admin'?'Панель администратора':'Личный дневник ученика'}</div></div><nav class="nav">${role==='admin'?`<button class="btn" id="settings">⚙ Настройки</button><button class="btn" id="students">Пользователи</button>`:''}<button class="btn" id="logout">Сменить режим</button></nav></header><main id="main"></main></div>${modal?'<div class="modal-bg" id="modalBg"><div class="modal" id="modalContent"></div></div>':''}`;$('logout').onclick=()=>{role='';modal='';render()};if(role==='admin'){$('settings').onclick=()=>openModal('settings');$('students').onclick=()=>openModal('students');re function renderAdmin(){const group=db.groups.find(g=>g.id===groupId);const members=db.students.filter(s=>s.groupId===groupId);if(!group){$('main').innerHTML=`<div class="panel"><div class="section-head"><div><h2>Группы</h2><div class="muted">Выберите группу, чтобы открыть журнал учеников</div></div><button class="btn primary" id="addGroup">＋ Создать группу</button></div><div class="group-cards">${db.groups.map(g=>`<button class="group group-card" data-group="${esc(g.id)}"><span><strong>${esc(g.name)}</strong><small style="display:block;margin-top:7px">${db.students.filter(s=>s.groupId===g.id).length} учеников</small></span><span>→</span></button>`).join('')||'<div class="empty">Групп пока нет. Создайте первую группу.</div>'}</div></div>`;$('addGroup').onclick=()=>openModal('group');document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{groupId=b.dataset.group;draft={};message='';render()});return} $('main').innerHTML=`<section class="panel"><div class="section-head"><div><button class="btn" id="backGroups">← Все группы</button><h2 style="margin-top:15px">${esc(group.name)}</h2><span class="muted">${members.length} учеников · Китайский язык</span></div><div class="fields"><button class="btn" id="renameGroup">Переименовать</button><button class="btn" id="addMember">＋ Ученики</button><input aria-label="Дата занятия" class="date" type="date" id="date" value="${esc(date)}"></div></div>${message?`<div class="notice">${esc(message)}</div>`:''}${members.length?`<div style="overflow-x:auto"><table class="roster"><thead><tr><th>Ученик</th><th>Оценка, %</th><th>Результат</th><th>Бонус</th></tr></thead><tbody>${members.map((s,i)=>{const d=draft[s.id]||{},v=d.percent??'',g=valid(v)?grade(Number(v)):null;return `<tr><td><div class="name">${i+1}. ${esc(s.name)}</div></td><td><input class="percent-input" data-id="${esc(s.id)}" type="number" min="0" max="100" step="1" inputmode="numeric" placeholder="0–100" value="${esc(v)}"></td><td><span class="score-preview">${g?`<sp l.oninput=()=>{(draft[el.dataset.bonus]??={}).bonus=el.value});document.querySelectorAll('[data-note]').forEach(el=>el.oninput=()=>{(draft[el.dataset.note]??={}).note=el.value});$('submit').onclick=submit}
function submit(){if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){alert('Выберите дату занятия');return}const entries=Object.entries(draft).filter(([id,d])=>db.students.some(s=>s.id===id&&s.groupId===groupId)&&d.percent!==undefined&&d.percent!=='');if(!entries.length){alert('Введите хотя бы одну оценку');return}for(const [id,d] of entries){if(!valid(d.percent)){alert('Процент должен быть целым числом от 0 до 100');return}if(d.bonus!==undefined&&d.bonus!==''&&(!Number.isSafeInteger(Number(d.bonus))||Number(d.bonus)<0)){alert('Дополнительный бонус должен быть неотрицательным целым числом');return}if(Number(d.bonus||0)>0&&!String(d.note||'').trim()){alert('Укажите причину дополнительного бонуса');return}}const subject='Китайский язык';const replacements=entries.filter(([id])=>db.records.some(r=>r.studentId===id&&r.date===date&&r.subject===subject));if(replacements.length&&!confirm(`У ${replacements.length} учеников уже есть оценка за эту дату и предмет. Заменить прежние записи без повторного начисления?`))return;const before=JSON.stringify(db.records);for(const [id,d] of entries){const p=Number(d.percent),g=grade(p),bonus=Number(d.bonus||0),old=db.records.findIndex(r=>r.studentId===id&&r.date===date&&r.subject===subject);const record={id:old>=0?db.records[old].id:uid(),studentId:id,groupId,date,subject,percent:p,letter:g.letter,gpa:g.gpa,traditional:g.traditional,color:g.color,basePoints:points(p),bonus,points:points(p)+bonus,note:String(d.note||'').trim(),createdAt:new Date().toISOString()};if(old>=0)db.records[old]=record;else db.records.push(record)}if(!save()){db.records=JSON.parse(before);return}const count=entries.length;draft={};message=`Сохранено оценок: ${count}. Дневники обновлены, повторного начисления нет.`;render()}
function renderStudent(){const s=db.students.find(x=>x.id===studentId);if(!s){role='';render();return}const all=records(studentId),today=all.filter(r=>r.date===selectedDate);const days=[];for(let offset=-5;offset<=5;offset++){const d=new Date(selectedDate+'T12:00:00');d.setDate(d.getDate()+offset);const iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;days.push(iso)}$('main').innerHTML=`<div class="panel"><div class="section-head"><div><h2>${esc(s.name)}</h2><div class="muted">${esc(db.groups.find(g=>g.id===s.groupId)?.name||'Без группы')} · Мой дневник</div></div></div><div class="section-head" style="margin-top:26px"><h2>${selectedDate===TODAY()?'Сегодня':'Занятия'} · ${short(selectedDate)}</h2><div class="fields"><button class="btn" id="prev">←</button><input type="date" id="pickDate" value="${esc(selectedDate)}" class="date"><button class="btn" id="next">→</button><button class="btn" id="today">Сегодня</button></div></div><div class="calendar">${days.map(d=>`<button class="day ${d===selectedDate?'active':''}" data-day="${d}"><small>${new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{weekday:'short'})}</small><b>${Number(d.slice(8))}</b>${all.some(r=>r.date===d)?'<div style="font-size:10px;margin-top:3px">●</div>':''}</button>`).join('')}</div>${today.length?today.map(r=>`<div class="hero" style="margin-bottom:12px"><div><div class="muted">${esc(r.subject)} · ${short(r.date)}</div><div class="grade" style="color:${r.color==='green'?'#31805d':r.color==='yellow'?'#b48a26':'#c34b47'}">${esc(r.letter)}</div><div class="percent">${r.percent}% <span class="score ${r.color}">${esc(r.traditional)}</span></div></div><div class="right"><div class="muted">Начислено за занятие</div><div class="money">+${r.points} ◈</div><div class="mini">Основные: ${r.basePoints} · Дополнительно: ${r.bonus}</div>${r.note?`<div class="mini" style="margin-top:8px;max-width:260px">${esc(r.note)}</div>`:''}</div></div>`).join(''):'<div class="empty">На выбранную дату оценок пока нет.</div>'}<h2 style="margin-top:30px">История занятий</h2>${all.length?all.map(r=>`<div class="record"><div class="record-head"><div><b>${short(r.date)} · ${esc(r.subject)}</b><div class="mini">${r.percent}% · ${esc(r.traditional)}</div>${r.note?`<div class="mini">${esc(r.note)}</div>`:''}</div><div class="right"><span class="score ${r.color}">${esc(r.letter)}</span><div style="font-weight:800;margin-top:5px">+${r.points} ◈</div></div></div></div>`).join(''):'<div class="empty">История пока пуста.</div>'}</div>`;const move=n=>{const d=new Date(selectedDate+'T12:00:00');d.setDate(d.getDate()+n);selectedDate=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;renderStudent()};$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('today').onclick=()=>{selectedDate=TODAY();renderStudent()};$('pickDate').onchange=e=>{if(e.target.value){selectedDate=e.target.value;renderStudent()}};document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.day;renderStudent()})}
function openModal(name){modal=name;render()}function closeModal(){modal='';render()}function renderModal(){const m=$('modalContent');$('modalBg').onclick=e=>{if(e.target===$('modalBg'))closeModal()};if(modal==='group'){m.innerHTML=`<h2>Новая группа</h2><label class="label">Название группы</label><input id="groupName" maxlength="80" placeholder="Например: Китайский · HSK 2"><div class="foot"><button class="btn" id="cancel">Отмена</button><button class="btn primary" id="create">Добавить группу</button></div>`;$('create').onclick=()=>{const name=$('groupName').value.trim();if(!name)return alert('Введите название группы');const id=uid();db.groups.push({id,name});if(!save()){db.groups.pop();return}groupId=id;draft={};closeModal()}}else if(modal==='settings'){m.innerHTML=`<h2>Настройки журнала</h2><p class="muted">Стандартная награда за занятие</p><label class="label">Игровые баллы за 100%</label><input type="number" id="reward" min="0" max="1000000" step="1" value="${db.settings.reward}"><p class="helper">Изменение действует на новые и обновлённые записи. Ранее сохранённые баллы не пересчитываются.</p><div class="foot"><button class="btn" id="cancel">Отмена</button><button class="btn primary" id="create">Сохранить</button></div>`;$('create').onclick=()=>{const n=Number($('reward').value);if(!Number.isSafeInteger(n)||n<0||n>1000000)return alert('Введите целое число от 0 до 1 000 000');const old=db.settings.reward;db.settings.reward=n;if(!save()){db.settings.reward=old;return}closeModal()}}else if(modal==='rename'){const g=db.groups.find(x=>x.id===groupId);m.innerHTML=`<h2>Название группы</h2><input id="groupName" maxlength="80" value="${esc(g.name)}"><div class="foot"><button class="btn" id="cancel">Отмена</button><button class="btn primary" id="create">Сохранить</button></div>`;$('create').onclick=()=>{const name=$('groupName').value.trim();if(!name)return alert('Введите название');const old=g.name;g.name=name;if(!save()){g.name=old;return}closeModal()}}else{m.innerHTML=`<h2>Пользователи Bank Mandarin Pro</h2><p class="muted">Демонстрационный список пользователей. После интеграции здесь будут реальные аккаунты из Bank Mandarin Pro.</p><label class="label">Поиск пользователя</label><input id="searchUser" placeholder="Имя или фамилия"><div id="userList" style="max-height:330px;overflow:auto;margin-top:12px"></div><div class="foot"><button class="btn" id="cancel">Готово</button></div>`;const draw=()=>{const q=$('searchUser').value.toLowerCase().trim();$('userList').innerHTML=db.students.filter(s=>s.name.toLowerCase().includes(q)).map(s=>`<div class="record"><div class="record-head"><span class="name">${esc(s.name)}</span><select data-move="${esc(s.id)}"><option value="">Без группы</option>${db.groups.map(g=>`<option value="${esc(g.id)}" ${g.id===s.groupId?'selected':''}>${esc(g.name)}</option>`).join('')}</select></div></div>`).join('')||'<div class="empty">Пользователи не найдены</div>';document.querySelectorAll('[data-move]').forEach(el=>el.onchange=()=>{const s=db.students.find(x=>x.id===el.dataset.move),old=s.groupId;s.groupId=el.value||null;if(!save())s.groupId=old})};$('searchUser').oninput=draw;draw()}$('cancel').onclick=closeModal}
render();})();
</script></body></html>
