function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),4000)}
const btn=(text,action,cls='',extra='')=>`<button type="button" class="btn ${cls}" data-act="${action}" ${extra}>${text}</button>`;
function masks(){return `<svg viewBox="0 0 260 230" fill="none"><defs><linearGradient id="gold" x2="1" y2="1"><stop stop-color="#f8df9d"/><stop offset="1" stop-color="#7e6740"/></linearGradient></defs><circle cx="155" cy="110" r="83" stroke="#d0b575" stroke-opacity=".12"/><circle cx="155" cy="110" r="102" stroke="#d0b575" stroke-opacity=".07"/><g transform="rotate(-18 110 120)"><path d="M48 56Q101 75 150 51L148 125Q135 170 102 185Q57 168 49 125Z" fill="#292922" stroke="url(#gold)" stroke-width="2"/><path d="M64 98Q78 82 91 98M109 97Q122 80 136 94" stroke="#dbc185" stroke-width="5" stroke-linecap="round"/><path d="M76 124Q102 154 129 122Q107 172 76 124" fill="url(#gold)"/></g><g transform="rotate(16 169 112)"><path d="M119 38Q168 60 218 37L215 113Q202 158 169 175Q129 155 120 111Z" fill="#2c2c24" stroke="url(#gold)" stroke-width="2"/><path d="M134 82Q147 95 158 81M179 80Q191 94 204 80" stroke="#dbc185" stroke-width="5" stroke-linecap="round"/><path d="M146 130Q171 93 194 128Q169 115 146 130" fill="url(#gold)"/></g><path d="m222 171 3 8 8 3-8 3-3 8-3-8-8-3 8-3Z" fill="#dec68d"/></svg>`}
function vault(){return `<svg viewBox="0 0 260 230" fill="none"><defs><linearGradient id="steel" x2="1" y2="1"><stop stop-color="#b8d7c9"/><stop offset="1" stop-color="#477c79"/></linearGradient></defs><circle cx="145" cy="110" r="98" stroke="#8fc7bf" stroke-opacity=".09"/><path d="m74 51 95-24 67 39v120l-92 30-70-40Z" fill="#213330" stroke="#719f94"/><path d="m74 51 70 42 92-27M144 93v123" stroke="#9ec3b0"/><path d="m88 72 42 27v91l-42-24Z" fill="#151f20" stroke="#719a8c"/><path d="m155 102 68-23v96l-68 24Z" fill="#132225" stroke="url(#steel)" stroke-width="2"/><ellipse cx="190" cy="138" rx="23" ry="29" transform="rotate(16 190 138)" stroke="url(#steel)" stroke-width="5"/><path d="m190 109 0 58m-23-27 46-9m-38-14 30 40m-1-43-30 46" stroke="#8db1a1" stroke-width="3"/><circle cx="190" cy="138" r="7" fill="#b4d0bd"/><path d="m95 101 27 17m-27-5 27 17m-27-5 27 17" stroke="#78998a" stroke-width="2"/><circle cx="213" cy="91" r="3" fill="#b5dac1"/></svg>`}
function navigate(p){revealed=false;page=p;render();window.scrollTo(0,0)}
function back(){return `<div class="topline"><button class="textbtn" data-act="home">← На главную</button><span class="tiny">Локальная игра · одно устройство</span></div>`}
function home(){return `<section class="hero"><div class="eyebrow">Два мира. Одна компания.</div><h1>Время быть<br><em>кем-то другим.</em></h1><p>Выберите игру, соберите учеников и откройте<br>первую карточку. Остальное — воображение.</p></section><section class="modes"><button class="mode" data-act="choose" data-mode="croc"><span class="num">01 / ПОКАЖИ БЕЗ СЛОВ</span><div class="art">${masks()}</div><h2>Крокодил</h2><p>Знакомые герои. Неожиданные образы.<br>Сможете показать, не произнеся ни слова?</p><div class="bottom"><span>${decks.croc.length} персонажей · жесты и мимика</span><span class="arrow">↗</span></div></button><button class="mode bunker" data-act="choose" data-mode="bunker"><span class="num">02 / ПРЕДСТАВЬ СВОЕГО ГЕРОЯ</span><div class="art">${vault()}</div><h2>Бункер</h2><p>У каждого — своя роль.<br>Откройте персонажа и расскажите о себе.</p><div class="bottom"><span>${decks.bunker.length} персонажей · разговор и фантазия</span><span class="arrow">↗</span></div></button></section><div class="home-actions">${room()?btn('Вернуться в комнату →','resume','primary'):btn('Войти по коду','joinpage')}${btn('Колоды персонажей','editor')}</div><div class="notice narrow">Играйте вместе на одном устройстве: передавайте телефон по очереди. Код работает только в этой открытой программе. Для разных телефонов потребуется подключение к серверу Mandarin Pro.</div>`}
function setup(){return `${back()}<section class="panel narrow"><div class="eyebrow">Новая комната</div><h1>Соберите свою компанию</h1><form id="create-form"><label for="mode">Игра</label><select id="mode"><option value="croc" ${mode==='croc'?'selected':''}>🎭 Крокодил</option><option value="bunker" ${mode==='bunker'?'selected':''}>🚀 Бункер</option></select><label for="pin">Придумайте ПИН ведущего · 4 цифры</label><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autocomplete="new-password" placeholder="••••"><p class="tiny">ПИН защищает кнопки ведущего при передаче телефона. Запомните его: восстановление не предусмотрено.</p><label for="distribution">Как выдать карточки</label><select id="distribution"><option value="turn">По очереди — при передаче телефона</option><option value="all">Всем сразу — личные карточки</option></select><label class="check"><input id="allow-next" type="checkbox" checked><span>Разрешить ученикам менять своего персонажа</span></label><div class="notice">Комната и личные карточки живут до перезагрузки страницы. Это локальный режим, без аккаунтов и интернет-подключения.</div><button class="btn primary full" type="submit">Создать комнату →</button></form></section>`}
function joinPage(){return `${back()}<section class="panel narrow"><div class="eyebrow">На этом устройстве</div><h1>Присоединиться к игре</h1><p>Введите код комнаты, которую учитель создал в этой открытой программе.</p><form id="join-form"><label for="join-code">Код комнаты</label><input id="join-code" maxlength="6" minlength="6" required autocapitalize="characters" autocomplete="off" placeholder="ABC234"><label for="join-name">Ваше имя</label><input id="join-name" maxlength="32" required autocomplete="off" placeholder="Например, Аружан"><div class="actions"><button class="btn primary full">Присоединиться</button></div></form></section>`}
function roomHeader(){const r=room();return `${back()}<div class="room-head"><div><div class="eyebrow">${r.phase==='waiting'?'Зал ожидания':'Игра началась'} · ведущий</div><h1>${titles[r.mode]}</h1></div><div class="code">Код этой комнаты<strong>${r.code}</strong></div></div>`}
function lobby(){const r=room();return `${roomHeader()}<div class="room-grid"><section class="panel"><div class="row"><h2>Ваша компания</h2><span class="pill">${r.players.length} / 50</span></div><div class="orbit">${r.players.length?r.players.map(p=>`<div class="member"><div class="avatar">${esc(p.name[0].toUpperCase())}</div><span>${esc(p.name)}</span></div>`).join(''):`<div class="empty"><svg viewBox="0 0 80 80" fill="none" stroke="currentColor"><circle cx="40" cy="40" r="32" stroke-dasharray="3 5"/><path d="M29 40h22M40 29v22"/></svg>Первые герои пока в пути</div>`}</div><p class="tiny">Добавьте имена здесь или передайте телефон ученику для входа по коду.</p>${btn('Передать для входа по коду','handoffjoin','full')}</section><section class="panel"><h2>Участники</h2><form id="add-form"><label for="add-name">Имя ученика</label><div class="row"><input id="add-name" maxlength="32" required placeholder="Введите имя" autocomplete="off"><button class="btn" aria-label="Добавить участника">＋</button></div></form><div class="participants">${r.players.map(p=>`<div class="person"><div class="name">${esc(p.name)}</div>${btn('×','remove','small',`data-id="${p.id}" aria-label="Удалить ${esc(p.name)}"`)}</div>`).join('')}</div><div class="actions">${btn('Начать игру →','start','primary full',r.players.length?'':'disabled')}</div>${btn('Закрыть комнату','close','danger full', 'style="margin-top:10px"')}</section></div>`}
function hostGame(){const r=room();return `${roomHeader()}<div class="room-grid"><section class="panel"><div class="eyebrow">Личные карточки</div><h2>Передайте телефон герою</h2><p>Выберите ученика. Его карточка появится закрытой — открыть её сможет он сам. После просмотра верните телефон ведущему.</p><div class="participants">${r.players.map(p=>`<div class="person"><div class="avatar">${esc(p.name[0].toUpperCase())}</div><div class="name">${esc(p.name)}<small>${p.card?'Карточка выдана':'Ожидает карточку'}</small></div>${btn(p.card?'Передать →':'Выдать →','give','small',`data-id="${p.id}" ${!p.card&&!r.pool.length?'disabled':''}`)}</div>`).join('')}</div></section><section class="panel"><div class="eyebrow">Колода ${titles[r.mode]}</div><h2>${r.pool.length} в запасе</h2><p>До конца колоды персонажи не повторяются. На карточке каждого ученика — только его название.</p><label class="check"><input id="live-next" type="checkbox" ${r.allowNext?'checked':''}><span>Ученики могут менять персонажа</span></label>${btn('Раздать тем, кто ещё ждёт','dealpending','full','style="margin-top:20px"')}<div class="actions">${btn('Перемешать колоду','reshuffle')}</div><div class="notice">При перемешивании уже использованные персонажи снова попадут в колоду. Текущие личные карточки сохранятся.</div>${btn('Завершить игру','finish','primary full')}${btn('Закрыть комнату','close','danger full','style="margin-top:10px"')}</section></div>`}
function playerView(){const r=room(),p=r.players.find(x=>x.id===active);if(!p)return '';return `<div class="topline"><span class="eyebrow">${titles[r.mode]} · личная карточка</span>${btn('Ведущий','teacher','small')}</div><div class="view-title"><div class="tiny">${r.phase==='waiting'?'Вы в комнате '+r.code:'Передайте телефон участнику'}</div><h1>${esc(p.name)}</h1></div>${r.phase==='waiting'?`<section class="panel narrow" style="margin-top:30px;text-align:center"><div class="seal" style="margin:30px auto">✦</div><h2>Ждём начала игры</h2><p>Верните телефон учителю. Он начнёт игру, когда все будут готовы.</p>${btn('Передать следующему ученику','joinpage','full')}${btn('Вернуть ведущему','teacher','primary full','style="margin-top:10px"')}</section>`:`<div class="card-area"><div class="card-stage"><button id="secret-card" class="game-card ${r.mode}" data-act="flip" aria-label="Открыть карточку" aria-pressed="false"><span class="seal" aria-hidden="true">✦</span></button></div><div class="card-hint" id="card-hint">Нажмите на карточку, чтобы открыть</div><div class="view-actions">${btn('Следующий персонаж →','next','primary',r.allowNext&&r.pool.length?'':'disabled')}${!r.allowNext?'<div class="tiny" style="text-align:center">Смена персонажа выключена ведущим</div>':''}${btn('Скрыть и вернуть ведущему','done')}</div></div>`}`}
function editor(){return `${back()}<section class="panel narrow"><div class="eyebrow">Ваша коллекция</div><h1>Колоды персонажей</h1><p>Изменения применяются к новым комнатам. Если браузер разрешает хранение данных, колоды сохранятся на этом устройстве.</p><label for="editor-mode">Игра</label><select id="editor-mode"><option value="croc" ${editorMode==='croc'?'selected':''}>Крокодил</option><option value="bunker" ${editorMode==='bunker'?'selected':''}>Бункер</option></select><form id="custom-form"><label for="custom-name">Новый персонаж</label><div class="row"><input id="custom-name" maxlength="100" required placeholder="Название персонажа"><button class="btn" aria-label="Добавить персонажа">＋</button></div></form><div class="row" style="margin-top:22px"><span class="tiny">${decks[editorMode].length} персонажей</span>${btn('Восстановить исходную','restore','small')}</div><div class="editor-list">${decks[editorMode].map((n,i)=>`<div class="entry"><span>${esc(n)}</span>${btn('×','deletecard','small',`data-index="${i}" aria-label="Удалить ${esc(n)}"`)}</div>`).join('')}</div></section>`}
function render(){if(['lobby','game','player','gate','finished'].includes(page)&&!room())page='home';if(['lobby','game','editor'].includes(page)&&!host)page='gate';let html='';if(page==='home')html=home();if(page==='setup')html=setup();if(page==='join')html=joinPage();if(page==='lobby')html=lobby();if(page==='game')html=hostGame();if(page==='player')html=playerView();if(page==='editor')html=editor();if(page==='gate')html=`${back()}<section class="panel narrow"><div class="eyebrow">Управление комнатой</div><h1>Верните телефон ведущему</h1><p>Карточка скрыта. Введите ПИН, чтобы продолжить управление игрой.</p><form id="unlock-form"><label for="unlock-pin">ПИН ведущего</label><input id="unlock-pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required placeholder="••••"><div class="actions"><button class="btn primary full">Открыть управление</button></div></form></section>`;if(page==='finished')html=`${back()}<section class="panel narrow" style="text-align:center"><div class="seal" style="margin:30px auto">✦</div><h1>Спасибо за игру!</h1><p>Комната ${room().code} завершила игру. Можно сыграть ещё раз с тем же составом или выбрать другой режим.</p>${btn('Ещё раз с тем же составом','restart','primary full')}${btn('Закрыть и выбрать игру','close','full','style="margin-top:12px"')}</section>`;$('#app').innerHTML=html}
function hideCard(){revealed=false;const card=$('#secret-card');if(card){card.innerHTML='<span class="seal" aria-hidden="true">✦</span>';card.classList.remove('revealed','turn');card.setAttribute('aria-label','Открыть карточку');card.setAttribute('aria-pressed','false');$('#card-hint').textContent='Нажмите на карточку, чтобы открыть'}}
function flip(){if(page!=='player'||room()?.phase!=='playing')return;const p=room().players.find(p=>p.id===active);if(!p?.card)return;const card=$('#secret-card');if(revealed){hideCard();card.classList.add('turn')}else{revealed=true;card.innerHTML=`<b>${esc(p.card)}</b>`;card.classList.remove('turn');void card.offsetWidth;card.classList.add('turn','revealed');card.setAttribute('aria-label','Скрыть карточку');card.setAttribute('aria-pressed','true');$('#card-hint').textContent='Нажмите ещё раз, чтобы скрыть'} }
function confirmBox(title,message,yes,callback){hideCard();const d=$('#dialog');d.innerHTML=`<h2>${esc(title)}</h2><p>${esc(message)}</p><div class="actions"><button class="btn" id="cancel-dialog">Отмена</button><button class="btn primary" id="accept-dialog">${esc(yes)}</button></div>`;d.showModal();$('#cancel-dialog').onclick=()=>d.close();$('#accept-dialog').onclick=()=>{d.close();try{callback()}catch(e){toast(e.message)}}}
function saveDecks(){try{localStorage.setItem('mp-party-decks-v1',JSON.stringify(decks))}catch{toast('Колода изменена только до закрытия страницы: браузер запретил сохранение.')}}
const hostActs=new Set(['remove','start','give','dealpending','reshuffle','finish','restart','close','deletecard','restore']);
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;if(hostActs.has(a)&&!host){navigate('gate');return}try{switch(a){
case 'home':hideCard();navigate('home');break;
case 'choose':mode=b.dataset.mode;if(room()){toast('Сначала завершите и закройте текущую комнату.');navigate(host?(room().phase==='waiting'?'lobby':room().phase==='playing'?'game':'finished'):'gate')}else navigate('setup');break;
case 'joinpage':navigate('join');break;
case 'handoffjoin':host=false;active=null;navigate('join');break;
case 'resume':navigate(host?(room().phase==='waiting'?'lobby':room().phase==='playing'?'game':'finished'):'gate');break;
case 'editor':if(room()&&!host){navigate('gate');break}navigate('editor');break;
case 'remove':room().players=room().players.filter(p=>p.id!==Number(b.dataset.id));render();break;
case 'start':service.start();navigate('game');break;
case 'give':{const p=room().players.find(p=>p.id===Number(b.dataset.id));if(!p.card)service.deal(p.id);active=p.id;host=false;navigate('player');break}
case 'flip':flip();break;
case 'next':if(!room().allowNext||room().phase!=='playing')return;hideCard();service.deal(active);render();toast('Новый персонаж готов. Нажмите на карточку.');break;
case 'done':case 'teacher':hideCard();host=false;active=null;navigate('gate');break;
case 'dealpending':{const pending=room().players.filter(p=>!p.card);if(!pending.length){toast('У всех уже есть карточки.');break}if(pending.length>room().pool.length)throw Error('Недостаточно карточек. Перемешайте колоду.');pending.forEach(p=>service.deal(p.id));render();toast('Личные карточки выданы.');break}
case 'reshuffle':confirmBox('Перемешать колоду?','Использованные персонажи могут повториться. Личные карточки участников сохранятся.','Перемешать',()=>{const held=new Set(room().players.map(p=>p.card));room().pool=shuffle(decks[room().mode].filter(x=>!held.has(x)));room().used=[];render();toast('Колода перемешана.');});break;
case 'finish':confirmBox('Завершить игру?','Личные карточки будут удалены. Список участников останется для следующей игры.','Завершить',()=>{room().phase='finished';room().players.forEach(p=>p.card=null);room().pool=[];room().used=[];navigate('finished')});break;
case 'restart':room().phase='waiting';room().pool=shuffle(decks[room().mode]);room().used=[];room().players.forEach(p=>p.card=null);navigate('lobby');break;
case 'close':confirmBox('Закрыть комнату?','Список участников и личные карточки будут удалены.','Закрыть',()=>{service.close();active=null;host=true;navigate('home')});break;
case 'deletecard':if(decks[editorMode].length<=1)throw Error('Оставьте в колоде хотя бы одного персонажа.');decks[editorMode].splice(Number(b.dataset.index),1);saveDecks();render();break;
case 'restore':confirmBox('Восстановить колоду?','Ваши добавления в этой колоде будут заменены исходным набором.','Восстановить',()=>{decks[editorMode]=[...DEFAULT_DECKS[editorMode]];saveDecks();render()});break;
}}catch(err){toast(err.message)}});
document.addEventListener('submit',e=>{e.preventDefault();try{switch(e.target.id){case 'create-form':{if(room())throw Error('Комната уже существует.');const pin=$('#pin').value;if(!/^\d{4}$/.test(pin))throw Error('ПИН должен состоять из четырёх цифр.');service.create({mode:$('#mode').value,pin,allowNext:$('#allow-next').checked,distribution:$('#distribution').value});host=true;navigate('lobby');break}case 'add-form':if(!host)return;service.join(room().code,$('#add-name').value);render();$('#add-name').focus();break;case 'join-form':{const p=service.join($('#join-code').value.trim(),$('#join-name').value);active=p.id;host=false;navigate('player');break}case 'unlock-form':if($('#unlock-pin').value!==room().pin){$('#unlock-pin').value='';throw Error('Неверный ПИН ведущего.')}host=true;navigate(room().phase==='waiting'?'lobby':room().phase==='playing'?'game':'finished');break;case 'custom-form':{if(!host)return;const n=$('#custom-name').value.trim();if(!n)throw Error('Введите название.');if(decks[editorMode].some(x=>x.toLowerCase()===n.toLowerCase()))throw Error('Этот персонаж уже в колоде.');decks[editorMode].push(n);saveDecks();render();$('#custom-name').focus();break}}}catch(err){toast(err.message)}});
document.addEventListener('change',e=>{if(e.target.id==='editor-mode'){editorMode=e.target.value;render()}if(e.target.id==='live-next'&&host)room().allowNext=e.target.checked});
document.addEventListener('visibilitychange',()=>{if(document.hidden)hideCard()});window.addEventListener('blur',hideCard);window.addEventListener('pagehide',hideCard);window.addEventListener('beforeunload',e=>{if(room()){e.preventDefault();e.returnValue=''}});document.addEventListener('keydown',e=>{if(e.key==='Escape')hideCard()});
$('#fullscreen').onclick=async()=>{hideCard();try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else toast('Этот браузер не поддерживает полный экран. Интерфейс уже подстроен под размер окна.')}catch{toast('Браузер не разрешил полноэкранный режим.')}};
render();
</script></body></html>
