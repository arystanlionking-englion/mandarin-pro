<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100b14"><title>МАФИЯ — Mandarin Pro</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#f8eedc;background:#100b14;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#622036 0,transparent 58%),radial-gradient(ellipse at 90% 90%,#38142a 0,transparent 52%),#100b14}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.38;cursor:default}.app{max-width:560px;margin:auto;padding:20px 16px 45px}.brand{text-align:center;padding:16px 0 20px}.eyebrow{font-size:11px;letter-spacing:.38em;color:#e5bb76}.brand h1{font:700 clamp(50px,14vw,76px)/1 Georgia,serif;letter-spacing:.12em;margin:8px 0;color:#f3d89c;text-shadow:0 3px 25px #b17b3b55}.brand p{color:#c5adac;font-size:13px;letter-spacing:.08em;margin:6px 0}.rule{height:1px;background:linear-gradient(90deg,transparent,#b58b57,transparent);margin:6px 0 20px}.panel{border:1px solid #9c77525e;background:#ffffff08;border-radius:19px;padding:18px;margin:12px 0;box-shadow:0 12px 28px #00000020}.panel h2{font:500 22px Georgia,serif;color:#f0d49b;margin:0 0 13px}.muted{color:#b9a8a9;font-size:13px;line-height:1.5}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.step{display:flex;align-items:center;justify-content:space-between;gap:12px}.count{font:600 44px Georgia,serif;text-align:center}.step button{width:52px;height:52px;border:1px solid #cba2686c;border-radius:15px;background:#f1d4a90c;color:#f4d59d;font-size:29px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.chip{padding:10px 13px;background:#ffffff08;color:#e9d6bc;border:1px solid #b28b604a;border-radius:12px}.chip.active{background:#d3a760;color:#201319;border-color:#d3a760;font-weight:800}.btn{width:100%;border:1px solid #d2aa71;background:#ffffff07;color:#f3dfbc;min-height:52px;padding:12px;border-radius:14px;font-weight:700;margin-top:10px}.btn.primary{background:linear-gradient(120deg,#f2d89d,#c18b45);color:#211318;box-shadow:0 8px circle at 50% 40%,#75243e,#280e1d 72%)}.face:before{content:'';position:absolute;inset:10px;border:1px solid #d9b47477;border-radius:15px;pointer-events:none}.seal{border:2px solid #e0b97d;border-radius:50%;width:128px;height:128px;display:grid;place-items:center;font:70px Georgia,serif;color:#efd6a4;box-shadow:0 0 45px #c69d5d2b}.back .hint{font-size:14px;letter-spacing:.1em;color:#e6c99b;margin-top:28px}.face.front{transform:rotateY(180deg);display:flex;align-items:center;flex-direction:column;justify-content:center;padding:25px 16px;text-align:center;background:radial-gradient(circle at 50% 30%,var(--glow),transparent 63%),linear-gradient(#241622,#120e18);border-color:var(--accent)}.face.front .glyph{width:128px;height:128px;display:grid;place-items:center;color:var(--accent);filter:drop-shadow(0 0 18px var(--glow))}.glyph svg{width:112px;height:112px}.role-name{font:700 30px/1.1 Georgia,serif;margin:10px 0;color:#f7ebdc}.role-desc{font-size:14px;color:#dacfc7;line-height:1.5}.role-player{color:var(--accent);font-weight:700;margin-top:18px}.timer{font:600 66px Georgia,serif;color:#f3d89c;font-variant-numeric:tabular-nums;text-align:center;margin:12px 0}.timer.ending{color:#f27884}.timer[data-act="timerToggle"]{cursor:pointer;user-select:none;-webkit-user-select:none;border:1px solid #cda15f66;border-radius:18px;padding:14px 5px;background:#d3a7600d;touch-action:manipulation}.timer[data-act="timerToggle"]:active{transform:scale(.98)}.overlay{position:fixed;inset:0;z-index:10;background:#08050bd9;display:grid;place-items:center;padding:18px}.dialog{width:min(100%,390px);padding:23px;border-radius:18px;background:#211623;border:1px solid #c89d62}.dialog h2{margin:0 0 12px;font:500 23px Georgia,serif}.dialog .actions{display:flex;gap:10px}.dialog .actions button{flex:1}.hidden{display:none!important}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1}.big-message{font:500 27px Georgia,serif;color:#f2d89d;text-align:center;margin:25px 0}.tiny{font-size:12px;color:#b9a8a9}.role-pill{color:var(--color);font-size:12px}.divider{height:1px;background:#ffffff20;margin:16px 0}@media(max-width:380px){.card-scene{height:390px}.role-name{font-size:25px}.face.front .glyph{height:105px}.app{padding-left:12px;padding-right:12px}}@media(prefers-reduced-motion:reduce){.playing-card{transition:none}}

.orbit-core b{font:700 clamp(18px,5vw,27px) Georgia,serif;color:#f6d99d}.orbit-core small{font-size:11px;color:#d4b8b6;margin-top:6px}.orbit-user{position:absolute;transform:translate(-50%,-50%);width:75px;display:flex;flex-direction:column;align-items:center;gap:5px;z-index:2;animation:arrive .35s ease both}.orbit-avatar{width:49px;height:49px;border-radius:50%;border:2px solid #e5bd7a;background:linear-gradient(145deg,#793449,#291521);display:grid;place-items:center;color:#ffdfa8;font:700 18px Georgia,serif;box-shadow:0 3px 18px #0009}.orbit-user span{max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:#f6e8d7;text-shadow:0 2px 5px #000}.orbit-empty{position:absolute;left:50%;top:84%;transform:translateX(-50%);font-size:12px;color:#b9a8a9;text-align:center}@keyframes arrive{from{opacity:0;scale:.8}to{opacity:1;scale:1}}

</style></head><body><main class="app" id="app"></main><div id="modal"></div><script>
(()=>{'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const icons={mafia:'<svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 80Q60 12 100 80L60 108Z"/><path d="M28 75L47 70L54 79L38 83ZM92 75L73 70L66 79L82 83Z" fill="currentColor"/><path d="M60 84v17M42 54Q60 42 78 54"/></svg>',civilian:'<svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="3"><path d="M16 103V55L60 24L104 55V103Z"/><path d="M8 57L60 18L112 57"/><rect x="46" y="61" width="18" height="20" rx="2"/><path d="M74 103V75h17v28M12 103h96"/></svg>',doctor:'<svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="3"><circle cx="60" cy="60" r="48"/><path d="M51 29h18v22h22v18H69v22H51V69H29V51h22z" fill="currentColor" fill-opacity=".25"/></svg>',commissar:'<svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="3"><circle cx="60" cy="60" r="49"/><path d="M60 18L72 46L102 49L79 68L86 98L60 81L34 98L41 68L18 49L48 46Z" fill="currentColor" fill-opacity=".25"/><circle cx="60" cy="61" r="8"/></svg>'};
const roles={mafia:{name:'МАФИЯ',desc:'Вы — мафия. Сохраняйте свою роль в секрете.',accent:'#e36b80',glow:'#9b233d77'},civilian:{name:'МИРНЫЙ ЖИТЕЛЬ',desc:'Вы — мирный житель. Найдите мафию вместе с городом.',accent:'#edc47b',glow:'#ad7c2870'},doctor:{name:'ДОКТОР',desc:'Вы — доктор. Лечите игроков по правилам ведущего.',accent:'#79d8b2',glow:'#267a6477'},commissar:{name:'КОМИССАР',desc:'Вы — комиссар. Проверяйте подозреваемых по правилам ведущего.',accent:'#8cb4ff',glow:'#3157a477'}};
const STORAGE='mp_mafia_simple_v3';
const demoAccounts=[{id:'teacher',name:'Преподаватель'}];
let state;try{state=JSON.parse(localStorage.getItem(STORAGE))}catch(e){};
if(!state||!Array.isArray(state.joined))state={phase:'waiting',joined:[],players:[],hostId:null,config:{doctor:true,commissar:true,mafia:'auto',duration:90},timer:{duration:90,left:90,running:false,end:0},version:0};
if(typeof state.ready!=='boolean')state.ready=false;
let activeId=sessionStorage.getItem('mp_demo_identity')||'teacher',open=false,showRoles=false,modalFn=null,ringDone=false;
// INTEGRATION ADAPTER: replace demo identity and local state with authenticated server API.
// getCurrentUser() -> {id,name,isAdmin}; joinRoom(); getRoomState(); subscribeRoom();
// adminStart(), hostTimer(), hostExclude(), adminReset() must be validated on server.
// Never send all players' roles to a non-host client. This standalone file is DEMO ONLY.
const getCurrentUser=()=>({...(demoAccounts.find(x=>x.id===activeId)||demoAccounts[0]),isAdmin:activeId==='teacher'});
const save=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){}};
function rand(n){if(crypto?.getRandomValues){let a=new Uint32Array(1),limit=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%n}return Math.floor(Math.random()*n)}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function left(){return state.timer.running?Math.max(0,Math.ceil((state.timer.end-Date.now())/1000)):state.timer.left}
function heading(sub){return `<header class="brand"><div class="eyebrow">MANDARIN PRO</div><h1>МАФИЯ</h1><p>${sub}</p></header><div class="rule"></div>`}
function button(label,act,cls=''){return `<button type="button" class="btn ${cls}" data-act="${act}">${label}</button>`}
function person(p,host){return `<div class="person"><div class="identity"><strong>${esc(p.name)}</strong><small>${p.out?'Выбыл':host?'Ведущий · в игре':'В игре'}</small></div>${host?'<span class="tag">ВЕДУЩИЙ</span>':''}</div>`}
function orbit(){let a=state.joined,n=a.length;return `<div class="orbit"><div class="orbit-core"><b>МАФИЯ</b><small>${n} ${n===1?'участник':n>=2&&n<=4?'участника':'участников'}</small></div>${a.map((p,i)=>{let ang=(-90+i*360/n)*Math.PI/180;let x=50+42*Math.cos(ang),y=50+42*Math.sin(ang);return `<div class="orbit-user" style="left:${x.toFixed(2)}%;top:${y.toFixed(2)}%;animation-delay:${Math.min(i*40,400)}ms"><div class="orbit-avatar">${esc(p.name.trim().charAt(0).toUpperCase())}</div><span title="${esc(p.name)}">${esc(p.name)}</span></div>`}).join('')}${n===0?'<div class="orbit-empty">Пока никого нет</div>':''}</div>`}
function render(){let u=getCurrentUser(),mine=state.players.find(p=>p.id===u.id),host=state.hostId===u.id,joined=state.joined.some(p=>p.id===u.id);let out=heading('СЕКРЕТНЫЕ КАРТЫ');out+=`<div class="demo-strip">ДЕМО · Переключение аккаунтов для проверки, без сервера. Настоящие аккаунты подключаются позже через BANK MANDARIN PRO.<div class="demo-switch"><select class="field" id="account">${demoAccounts.map(a=>`<option value="${a.id}" ${u.id===a.id?'selected':''}>${esc(a.name)}${a.id==='teacher'?' · администратор':''}</option>`).join('')}</select></div></div>`;
if(state.phase==='waiting'){
out+=`<section class="panel center"><h2>${state.ready?'Зал ожидания':'Комната готовится'}</h2><p class="muted">${state.ready?'Участники появляются по кругу по мере входа':'Администратор готовит комнату. Скоро начнём!'}</p>${orbit()}</section>`;
if(u.isAdmin){out+=`<section class="panel"><h2>Панель администратора</h2><p class="muted">Настройте комнату один раз, затем дождитесь учеников.</p><label class="row">Доктор <input type="checkbox" data-setting="doctor" ${state.config.doctor?'checked':''}></label><div class="divider"></div><label class="row">Комиссар <input type="checkbox" data-setting="commissar" ${state.config.commissar?'checked':''}></label><div class="divider"></div><p class="muted">Мафиози и ведущий выбираются автоматически. Количество игроков определяется по вошедшим пользователям.</p>${!state.ready?button('КОМНАТА ГОТОВА · ОТКРЫТЬ ОЖИДАНИЕ','prepare','primary'):''}${state.ready?`<p class="muted">Комната открыта · участников: ${state.joined.length}</p>${button('НАЧАТЬ ПАРТИЮ · РАЗДАТЬ КАРТЫ','start','primary')}`:''}${!joined?button('Присоединиться самому как игрок','join'):''}</section>`}
else if(!joined){out+=`<section class="panel center"><p class="muted">${state.ready?'Вы можете войти в комнату':'Ожидайте подготовки комнаты администратором'}</p>${state.ready?button('ВОЙТИ В КОМНАТУ','join','primary'):''}</section>`}
else out+='<p class="center muted">Вы в комнате. Ожидайте начала партии.</p>';
}else if(!mine){const realPlayers=(state.players||[]).filter(p=>p&&p.id);out+=realPlayers.length?`<section class="panel center"><h2>Партия уже началась</h2><p class="muted">Дождитесь следующей раздачи.</p></section>`:`<section class="panel center"><h2>Партия ещё не запущена</h2><p class="muted">Ожидайте, пока администратор запустит раздачу.</p></section>`}
else {out+=`<p class="center muted">${esc(u.name)}</p>`;
if(mine.out){out+='<div class="big-message">Вы выбыли из игры</div>'}else{let r=roles[mine.role]||roles.civilian;out+=`<div class="card-scene"><div class="playing-card ${open?'open':''}" id="card" role="button" tabindex="0" aria-label="Открыть или скрыть свою карту"><div class="face back"><div class="seal">密</div><div class="hint">НАЖМИ НА КАРТУ</div></div><div class="face front" style="--accent:${r.accent};--glow:${r.glow}"><div class="glyph">${icons[mine.role]||icons.civilian}</div><div class="role-name">${r.name}</div><div class="role-desc">${r.desc}</div><div class="role-player">${esc(mine.name)}</div>${host?'<div class="host-mark">✦ ВЫ ТАКЖЕ ВЕДУЩИЙ ✦</div>':''}</div></div></div><p class="center muted">Нажмите на карту, чтобы открыть или скрыть её</p>`}
if(host){out+=`<section class="panel"><h2>Управление ведущего</h2><p class="muted">Вы случайно выбраны ведущим и одновременно участвуете в игре.</p><div class="chips">${[60,90,120,180].map(n=>`<button class="chip ${state.timer.duration===n?'active':''}" data-act="duration" data-val="${n}">${fmt(n)}</button>`).join('')}</div><div id="timer" class="timer" data-act="timerToggle" role="button" tabindex="0">${fmt(left())}</div><p class="center muted">Нажмите на цифры: старт / пауза / продолжить</p>${button('Сбросить таймер','resetTimer')}<div class="divider"></div><div class="row"><h2 style="margin:0">Участники</h2><button class="btn small" data-act="roles">${showRoles?'Скрыть роли':'Посмотреть роли'}</button></div>${state.players.map(p=>`<div class="person"><div class="identity"><strong>${esc(p.name)}</strong><small>${p.out?'Выбыл':'Активен'}${showRoles?' · '+esc(roles[p.role]?.name||''):''}</small></div><button class="btn small ${p.out?'':'danger'}" data-act="exclude" data-val="${esc(p.id)}">${p.out?'Вернуть':'Исключить'}</button></div>`).join('')}</section>`}
if(u.isAdmin)out+=button('Завершить партию и открыть ожидание','finish','danger');
}
$('#app').innerHTML=out;}
function ask(msg,fn){modalFn=fn;$('#modal').innerHTML=`<div class="overlay"><div class="dialog"><h2>Подтверждение</h2><p class="muted">${esc(msg)}</p><div class="actions"><button class="btn" data-modal="no">Отмена</button><button class="btn primary" data-modal="yes">Подтвердить</button></div></div></div>`}
function chime(){try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return;let a=new C();if(a.state==='suspended')a.resume();[523.25,659.25,783.99,1046.5].forEach((hz,i)=>{let o=a.createOscillator(),g=a.createGain(),t=a.currentTime+i*.18;o.type='sine';o.frequency.value=hz;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.15,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+.75);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.78)});setTimeout(()=>a.close(),2000)}catch(e){}}
function start(){if(!getCurrentUser().isAdmin||!state.ready)return;if(state.joined.length<4){ask('Для партии нужно хотя бы 4 подключившихся участника.',()=>{});return}if(state.joined.length>20){ask('Максимум 20 участников.',()=>{});return}let n=state.joined.length,m=Math.max(1,Math.floor(n/3)),extra=Number(state.config.doctor)+Number(state.config.commissar);if(n-m-extra<1){ask('Недостаточно участников для выбранных ролей.',()=>{});return}let deck=shuffle([...Array(m).fill('mafia'),...Array(state.config.doctor?1:0).fill('doctor'),...Array(state.config.commissar?1:0).fill('commissar'),...Array(n-m-extra).fill('civilian')]);state.players=state.joined.map((p,i)=>({...p,role:deck[i],out:false}));state.hostId=state.players[rand(n)].id;state.phase='playing';state.timer={duration:state.config.duration,left:state.config.duration,running:false,end:0};state.version++;ringDone=false;save();render()}
$('#app').addEventListener('click',e=>{if(e.target.closest('#card')){open=!open;$('#card').classList.toggle('open',open);return}let b=e.target.closest('[data-act]');if(!b)return;let act=b.dataset.act,u=getCurrentUser(),isHost=state.hostId===u.id;switch(act){case 'prepare':if(u.isAdmin&&state.phase==='waiting')state.ready=true;break;case 'join':if(state.ready&&state.phase==='waiting'&&!state.joined.some(x=>x.id===u.id)){state.joined.push({id:u.id,name:u.name});save()}break;case 'start':start();return;case 'duration':if(!isHost)return;state.timer={duration:+b.dataset.val,left:+b.dataset.val,running:false,end:0};ringDone=false;break;case 'timerToggle':if(!isHost)return;if(state.timer.running){state.timer.left=left();state.timer.running=false}else{if(state.timer.left<=0)state.timer.left=state.timer.duration;state.timer.end=Date.now()+state.timer.left*1000;state.timer.running=true;ringDone=false;chimeUnlock()}break;case 'resetTimer':if(!isHost)return;state.timer.running=false;state.timer.left=state.timer.duration;ringDone=false;break;case 'roles':if(!isHost)return;showRoles=!showRoles;break;case 'exclude':if(!isHost)return;{let p=state.players.find(x=>x.id===b.dataset.val);if(!p)return;ask((p.out?'Вернуть ':'Исключить ')+p.name+'?',()=>{p.out=!p.out;save();render()});return}case 'finish':if(!u.isAdmin)return;ask('Завершить партию? Все ученики вернутся в ожидание.',()=>{state.phase='waiting';state.ready=true;state.players=[];state.joined=[];state.hostId=null;state.timer.running=false;open=false;save();render()});return}save();render()});
let audioUnlocked=false;function chimeUnlock(){if(audioUnlocked)return;try{let C=window.AudioContext||window.webkitAudioContext;if(C){let a=new C();a.resume?.();a.close?.();audioUnlocked=true}}catch(e){}}
$('#app').addEventListener('change',e=>{if(e.target.id==='account'){activeId=e.target.value;sessionStorage.setItem('mp_demo_identity',activeId);open=false;showRoles=false;render()}if(e.target.dataset.setting&&getCurrentUser().isAdmin&&state.phase==='waiting'){state.config[e.target.dataset.setting]=e.target.checked;save();render()}});
$('#app').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&(e.target.id==='card'||e.target.id==='timer')){e.preventDefault();e.target.click()}});
$('#modal').addEventListener('click',e=>{let b=e.target.closest('[data-modal]');if(!b)return;let f=modalFn;modalFn=null;$('#modal').innerHTML='';if(b.dataset.modal==='yes'&&f)f()});
setInterval(()=>{if(state.timer.running&&left()===0){state.timer.running=false;state.timer.left=0;save();if(!ringDone){ringDone=true;chime()}}let el=$('#timer');if(el){el.textContent=fmt(left());el.classList.toggle('ending',left()<=10)}},200);
window.addEventListener('storage',e=>{if(e.key===STORAGE){try{let x=JSON.parse(e.newValue);if(x){state=x;open=false;render()}}catch(err){}}});
render();
})();
</script></body></html>
